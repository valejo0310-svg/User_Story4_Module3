<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwi Store</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light">

    <div class="container mt-5">
        
        <!-- Title -->
        <div class="text-center mb-4">
            <h1 class="fw-bold text-primary">Riwi Store</h1>
            <p class="text-muted">Please add your purchase here</p>
        </div>

        <!-- Form Card -->
        <div class="card shadow p-4">
            <form id="form">

                <!-- Product -->
                <div class="mb-3">
                    <label for="product" class="form-label">Product Name</label>
                    <input 
                        type="text" 
                        id="product" 
                        class="form-control"
                        placeholder="Please enter your product"
                    >
                </div>

                <!-- Price -->
                <div class="mb-3">
                    <label for="price" class="form-label">Product Price</label>
                    <input 
                        type="text" 
                        id="price" 
                        class="form-control"
                        placeholder="Please enter the product price"
                    >
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea 
                        id="description" 
                        class="form-control"
                        rows="4"
                        placeholder="Please enter a brief description of the product"
                    ></textarea>
                </div>

                <!-- Button -->
                <div class="d-grid">
                    <button id="btn" class="btn btn-primary">
                        Register Purchase
                    </button>
                </div>

                <!-- Message -->
                <p id="message" class="text-center mt-3 text-success fw-semibold"></p>

            </form>
        </div>

        <!-- Product List -->
        <div class="mt-4">
            <h3 class="mb-3">Purchase List</h3>
            <ul id="list" class="list-group list-unstyled"></ul>
        </div>

    </div>

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- JS -->
    <script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Notes</title>
</head>
<body>
    <!--Brief description with title-->
    <h1>Riwi Store</h1>
    <p>Please add your purchase here</p>
    <!--Button and a formulary to add products-->
    <form id="form" action="">
        <input type="text" id="product" placeholder="Please ennter your product">
        <input type="text" name="" id="price" placeholder="Please enter the product's price">
        <textarea name="" id="description" placeholder="please enter a brief description of the product"></textarea>
        <button id="btn">Register Purchase</button>
        <p id="message"></p>
    </form>
    <ul id="list"></ul>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="script.js"></script>

</body>
</html>
